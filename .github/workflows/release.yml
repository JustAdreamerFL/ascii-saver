name: Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build and release
        required: true
        default: main
        type: string
      tag:
        description: Release tag (defaults to v<VERSION>)
        required: false
        default: ""
        type: string
      debian_version:
        description: Debian/Ubuntu container tag (latest, trixie, bookworm, ...)
        required: false
        default: latest
        type: string
      fedora_versions:
        description: Comma-separated Fedora tags (leave empty for current and previous stable)
        required: false
        default: ""
        type: string
      arch_image:
        description: Arch image tag (base-devel, base-devel-YYYYMMDD..., ...)
        required: false
        default: base-devel
        type: string
      dry_run:
        description: Build all artifacts without creating a GitHub release
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
      - name: Validate release metadata
        id: metadata
        shell: bash
        run: |
          version=$(head -n 1 VERSION)
          tag="${{ inputs.tag }}"
          tag=${tag:-v$version}
          if [[ "${{ inputs.dry_run }}" != "true" ]]; then
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              printf 'Invalid release tag: %s\n' "$tag" >&2
              exit 1
            fi
            if [[ "${tag#v}" != "$version" ]]; then
              printf 'Tag %s does not match VERSION %s\n' "$tag" "$version" >&2
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              printf 'Tag already exists: %s\n' "$tag" >&2
              exit 1
            fi
          fi
          printf 'version=%s\ntag=%s\n' "$version" "$tag" >> "$GITHUB_OUTPUT"
      - name: Validate release sources
        shell: bash
        run: |
          python3 -m compileall -q src scripts
          python3 scripts/check-release-assets.py
          bash -n install.sh
          bash -n install-online.sh
          bash -n uninstall.sh

  ttfx:
    name: Prebuilt ttfx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - name: Cache ttfx binary
        id: ttfx_binary
        uses: actions/cache@v4
        with:
          path: ttfx-rust/target/release/ttfx
          key: ${{ runner.os }}-ttfx-bin-${{ hashFiles('ttfx-rust/Cargo.lock', 'ttfx-rust/Cargo.toml', 'ttfx-rust/src/**') }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        if: steps.ttfx_binary.outputs.cache-hit != 'true'
        with:
          toolchain: stable
      - name: Cache Rust build
        if: steps.ttfx_binary.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ttfx-rust/target
          key: ${{ runner.os }}-ttfx-${{ hashFiles('ttfx-rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ttfx-
      - name: Build
        if: steps.ttfx_binary.outputs.cache-hit != 'true'
        run: |
          cargo build --manifest-path ttfx-rust/Cargo.toml --release --locked
      - name: Collect ttfx
        run: |
          mkdir -p out
          cp ttfx-rust/target/release/ttfx out/ttfx
      - uses: actions/upload-artifact@v4
        with:
          name: ttfx-linux-x86_64
          path: out/ttfx
          if-no-files-found: error

  source:
    name: Source archives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - name: Build archives
        shell: bash
        run: bash scripts/build-release.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-source
          path: dist/*
          if-no-files-found: error

  debian:
    name: Debian package
    needs: [prepare, ttfx, environments]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/justadreamerfl/ascii-saver-build-debian:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Report build target
        run: |
          echo "### Debian build target" >> "$GITHUB_STEP_SUMMARY"
          grep PRETTY_NAME /etc/os-release >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - uses: actions/download-artifact@v4
        with:
          name: ttfx-linux-x86_64
          path: ttfx-bin
      - name: Build
        shell: bash
        run: |
          install -m 0755 ttfx-bin/ttfx .package-ttfx
          dpkg-buildpackage -d -us -uc -b
          mkdir -p artifacts
          cp ../ascii-saver_*_*.deb artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: release-debian
          path: artifacts/*.deb
          if-no-files-found: error

  fedora_matrix:
    name: Resolve Fedora versions
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.matrix.outputs.versions }}
    steps:
      - name: Build matrix
        id: matrix
        shell: bash
        env:
          REQUESTED: ${{ inputs.fedora_versions }}
        run: |
          versions="$REQUESTED"
          if [[ -z "$versions" ]]; then
            latest=$(docker run --rm fedora:latest bash -lc \
              "grep '^VERSION_ID=' /etc/os-release | cut -d= -f2 | tr -d '\"'")
            if [[ ! "$latest" =~ ^[0-9]+$ ]]; then
              printf 'Could not resolve the current Fedora release from fedora:latest\n' >&2
              exit 1
            fi
            versions="$latest,$((latest - 1))"
          fi
          printf '### Fedora builds: %s\n' "$versions" >> "$GITHUB_STEP_SUMMARY"
          json=$(printf '%s' "$versions" | tr -d ' ' | tr ',' '\n' \
            | awk 'NF' | sort -nru | jq -R -s -c 'split("\n") | map(select(length > 0))')
          printf 'versions=%s\n' "$json" >> "$GITHUB_OUTPUT"

  environments:
    name: Prepare build environments
    needs: fedora_matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build missing environments
        shell: bash
        env:
          FEDORA_VERSIONS: ${{ needs.fedora_matrix.outputs.versions }}
        run: |
          set -euo pipefail
          exists() {
            docker manifest inspect "$1" >/dev/null 2>&1
          }
          debian=ghcr.io/justadreamerfl/ascii-saver-build-debian:latest
          if exists "$debian"; then
            echo "Present: $debian" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Building: $debian" >> "$GITHUB_STEP_SUMMARY"
            docker build --file .github/images/debian.Dockerfile \
              --tag "$debian" .github/images
            docker push "$debian"
          fi
          while read -r version; do
            image="ghcr.io/justadreamerfl/ascii-saver-build-fedora:$version"
            if exists "$image"; then
              echo "Present: $image" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Building: $image" >> "$GITHUB_STEP_SUMMARY"
              docker build --file .github/images/fedora.Dockerfile \
                --build-arg "FEDORA_VERSION=$version" --tag "$image" .github/images
              docker push "$image"
            fi
          done < <(jq -r '.[]' <<<"$FEDORA_VERSIONS")
          arch=ghcr.io/justadreamerfl/ascii-saver-build-arch:base
          if exists "$arch"; then
            echo "Present: $arch" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Building: $arch" >> "$GITHUB_STEP_SUMMARY"
            docker build --file .github/images/arch.Dockerfile \
              --tag "$arch" .github/images
            docker push "$arch"
          fi

  fedora:
    name: Fedora ${{ matrix.version }} package
    needs: [prepare, ttfx, fedora_matrix, environments]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.fedora_matrix.outputs.versions) }}
    container:
      image: ghcr.io/justadreamerfl/ascii-saver-build-fedora:${{ matrix.version }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Report build target
        run: |
          echo "### Fedora ${{ matrix.version }} build target" >> "$GITHUB_STEP_SUMMARY"
          grep PRETTY_NAME /etc/os-release >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - uses: actions/download-artifact@v4
        with:
          name: ttfx-linux-x86_64
          path: ttfx-bin
      - name: Build
        shell: bash
        run: |
          install -m 0755 ttfx-bin/ttfx .package-ttfx
          version=$(head -n 1 VERSION)
          topdir="$PWD/rpmbuild"
          mkdir -p "$topdir/SOURCES" "$topdir/SPECS" artifacts
          tar --exclude=.git --exclude=build --exclude=out --exclude=rpmbuild \
            --transform "s,^\./,ascii-saver-$version/," \
            -czf "$topdir/SOURCES/ascii-saver-$version.tar.gz" .
          rpmbuild -bb --nodeps packaging/fedora/ascii-saver.spec \
            --define "_topdir $topdir" \
            --define "_sourcedir $topdir/SOURCES"
          cp "$topdir"/RPMS/*/*.rpm artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: release-fedora-${{ matrix.version }}
          path: artifacts/*.rpm
          if-no-files-found: error

  arch:
    name: Arch package
    needs: [prepare, ttfx, environments]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/justadreamerfl/ascii-saver-build-arch:base
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Report build target
        run: |
          echo "### Arch build target" >> "$GITHUB_STEP_SUMMARY"
          grep PRETTY_NAME /etc/os-release >> "$GITHUB_STEP_SUMMARY"
          grep -E '^VERSION_ID' /etc/os-release >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - uses: actions/download-artifact@v4
        with:
          name: ttfx-linux-x86_64
          path: ttfx-bin
      - name: Build
        shell: bash
        run: |
          install -m 0755 ttfx-bin/ttfx .package-ttfx
          version=$(head -n 1 VERSION)
          mkdir -p /tmp/sources out artifacts
          tar --exclude=.git --exclude=build --exclude=out \
            --transform "s,^\./,ascii-saver-$version/," \
            -czf "/tmp/sources/ascii-saver-$version.tar.gz" .
          useradd --create-home builder
          chown -R builder:builder "$PWD" /tmp/sources
          su builder -c "cd '$PWD/packaging/arch' && SRCDEST=/tmp/sources PKGDEST='$PWD/out' makepkg --nodeps --noconfirm"
          cp out/ascii-saver-"$version"-*.pkg.tar.zst artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: release-arch
          path: artifacts/*.pkg.tar.zst
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [prepare, source, debian, fedora, arch]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum *.deb *.rpm *.pkg.tar.zst *.tar.gz > SHA256SUMS
      - name: Render release notes
        shell: bash
        run: |
          python3 scripts/render-release-notes.py             release-assets             "${{ needs.prepare.outputs.version }}"             "${{ needs.prepare.outputs.tag }}"             release-notes.md
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.prepare.outputs.tag }}" \
            --target "${{ inputs.branch }}" \
            --title "ASCII Saver ${{ needs.prepare.outputs.version }}" \
            --notes-file release-notes.md \
            release-assets/*
