name: Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build and release
        required: true
        default: main
        type: string
      tag:
        description: Release tag (defaults to v<VERSION>)
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Validate release metadata
        id: metadata
        shell: bash
        run: |
          version=$(head -n 1 VERSION)
          tag="${{ inputs.tag }}"
          tag=${tag:-v$version}
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            printf 'Invalid release tag: %s\n' "$tag" >&2
            exit 1
          fi
          if [[ "${tag#v}" != "$version" ]]; then
            printf 'Tag %s does not match VERSION %s\n' "$tag" "$version" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            printf 'Tag already exists: %s\n' "$tag" >&2
            exit 1
          fi
          printf 'version=%s\ntag=%s\n' "$version" "$tag" >> "$GITHUB_OUTPUT"

      - name: Validate release sources
        shell: bash
        run: |
          python3 -m compileall -q src scripts
          python3 scripts/check-release-assets.py
          bash -n install.sh
          bash -n install-online.sh
          bash -n uninstall.sh

      - name: Build release archives
        shell: bash
        run: bash scripts/build-release.sh dist

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.metadata.outputs.tag }}" \
            --target "${{ inputs.branch }}" \
            --title "ASCII Saver ${{ steps.metadata.outputs.version }}" \
            --generate-notes \
            dist/ascii-saver.tar.gz \
            dist/ascii-saver.tar.gz.sha256 \
            "dist/ascii-saver-${{ steps.metadata.outputs.version }}.tar.gz" \
            "dist/ascii-saver-${{ steps.metadata.outputs.version }}.tar.gz.sha256"
